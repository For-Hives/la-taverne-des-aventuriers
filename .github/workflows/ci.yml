name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verifier:
    name: verifier
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      # Même couple que la production (Coolify, Railpack) : Node de .node-version (variable RAILPACK_NODE_VERSION
      # dans Coolify), pnpm 12 (engines.pnpm de package.json).
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
        with:
          version: 12.17.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Installation figée
        run: pnpm install --frozen-lockfile
      - name: Types
        run: pnpm exec tsc --noEmit
      - name: Lint
        run: pnpm exec biome ci
      - name: Build contre le faux PocketBase
        run: pnpm build:ci
      - name: Tests unitaires, d'intégration et de fumée
        run: pnpm test

  # Tests e2e et non-régression visuelle au pixel près, dans l'image Docker officielle de Playwright :
  # la même que scripts/visuel-docker.sh, qui produit les captures de référence (tests/e2e/captures).
  # Garder la version de l'image égale à celle de @playwright/test dans package.json (un seul groupe Renovate).
  e2e-visuel:
    name: e2e-visuel
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --ipc=host --init
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
        with:
          version: 12.17.0
      - name: Installation figée
        run: pnpm install --frozen-lockfile
      - name: Build sur l'instantané des données (date figée)
        run: node scripts/instantane/avec-instantane.mjs node_modules/.bin/next build
      - name: Tests e2e, SEO et visuels
        run: node_modules/.bin/playwright test
      - name: Rapport en cas d'échec
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rapport-playwright
          path: |
            playwright-report/
            test-results/
          retention-days: 14
